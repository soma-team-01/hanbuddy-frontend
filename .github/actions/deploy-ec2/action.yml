name: Build and deploy frontend image
description: Build a HanBuddy frontend image, push it to ECR, and deploy it to EC2

inputs:
  environment-name:
    description: Deployment environment used in ECR image tags
    required: true
  commit-sha:
    description: Commit SHA used in the immutable ECR image tag
    required: true
  registry:
    description: ECR registry returned by amazon-ecr-login
    required: true

runs:
  using: composite
  steps:
    - name: Build and push image
      shell: bash
      env:
        COMMIT_SHA: ${{ inputs.commit-sha }}
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment-name }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        paypal_environment="sandbox"
        if [[ "${DEPLOYMENT_ENVIRONMENT}" == "production" ]]; then
          paypal_environment="production"
        fi
        build_config_hash="$(
          printf '%s\n%s\n%s\n' \
            "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" \
            "${PAYPAL_CLIENT_ID}" \
            "${paypal_environment}" \
            | sha256sum \
            | cut -c1-12
        )"
        image_tag="${DEPLOYMENT_ENVIRONMENT}-sha-${COMMIT_SHA}-config-${build_config_hash}"
        image_uri="${REGISTRY}/${ECR_REPOSITORY}:${image_tag}"
        latest_image_uri="${REGISTRY}/${ECR_REPOSITORY}:${DEPLOYMENT_ENVIRONMENT}-latest"

        if aws ecr describe-images \
          --repository-name "${ECR_REPOSITORY}" \
          --image-ids "imageTag=${image_tag}" >/dev/null 2>&1; then
          echo "Reusing immutable image ${image_uri}."
          docker pull "${image_uri}"
        else
          docker build \
            --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" \
            --build-arg "NEXT_PUBLIC_PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}" \
            --build-arg "NEXT_PUBLIC_PAYPAL_ENVIRONMENT=${paypal_environment}" \
            --tag "${image_uri}" \
            .
          docker push "${image_uri}"
        fi

        docker tag "${image_uri}" "${latest_image_uri}"
        docker push "${latest_image_uri}"
        echo "IMAGE_URI=${image_uri}" >> "${GITHUB_ENV}"

    - name: Deploy to EC2
      shell: bash
      run: |
        runtime_environment_json="$(jq -n \
          --arg api "${HANBUDDY_API_BASE_URL}" \
          --arg client_id "${GOOGLE_CLIENT_ID}" \
          --arg redirect_uri "${GOOGLE_REDIRECT_URI}" \
          '{
            HANBUDDY_API_BASE_URL: $api,
            GOOGLE_CLIENT_ID: $client_id,
            GOOGLE_REDIRECT_URI: $redirect_uri
          }')"
        export EC2_RUNTIME_ENVIRONMENT_JSON="${runtime_environment_json}"
        bash infra/aws/deploy-ec2.sh
