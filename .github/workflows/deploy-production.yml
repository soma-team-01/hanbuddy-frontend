name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'hanbuddy-frontend' }}
      LIGHTSAIL_SERVICE_NAME: hanbuddy-frontend-production
      LIGHTSAIL_POWER: ${{ vars.LIGHTSAIL_POWER || 'small' }}
      LIGHTSAIL_SCALE: ${{ vars.LIGHTSAIL_SCALE || '1' }}
      KNOWN_LIGHTSAIL_SERVICES: hanbuddy-frontend-production,hanbuddy-frontend-staging
      HANBUDDY_API_BASE_URL: ${{ vars.HANBUDDY_API_BASE_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      LIGHTSAIL_CERTIFICATE_NAME: ${{ vars.LIGHTSAIL_CERTIFICATE_NAME }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
      NEXT_PUBLIC_PAYPAL_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_PAYPAL_ENVIRONMENT || 'live' }}

    steps:
      - name: Check required configuration
        run: |
          test -n "${AWS_ROLE_ARN}" || { echo "Missing AWS_ROLE_ARN repository variable"; exit 1; }
          test -n "${HANBUDDY_API_BASE_URL}" || { echo "Missing HANBUDDY_API_BASE_URL production variable"; exit 1; }
          test -n "${GOOGLE_CLIENT_ID}" || { echo "Missing GOOGLE_CLIENT_ID production variable"; exit 1; }
          test -n "${GOOGLE_REDIRECT_URI}" || { echo "Missing GOOGLE_REDIRECT_URI production variable"; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          image_tag="production-sha-${COMMIT_SHA}"
          image_uri="${REGISTRY}/${ECR_REPOSITORY}:${image_tag}"
          docker build \
            --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" \
            --build-arg "NEXT_PUBLIC_PAYPAL_CLIENT_ID=${NEXT_PUBLIC_PAYPAL_CLIENT_ID}" \
            --build-arg "NEXT_PUBLIC_PAYPAL_ENVIRONMENT=${NEXT_PUBLIC_PAYPAL_ENVIRONMENT}" \
            --tag "${image_uri}" \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:production-latest" \
            .
          docker push "${image_uri}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:production-latest"
          echo "IMAGE_URI=${image_uri}" >> "${GITHUB_ENV}"

      - name: Deploy to Lightsail
        run: |
          environment_json="$(jq -n \
            --arg api "${HANBUDDY_API_BASE_URL}" \
            --arg client_id "${GOOGLE_CLIENT_ID}" \
            --arg redirect_uri "${GOOGLE_REDIRECT_URI}" \
            '{
              HANBUDDY_API_BASE_URL: $api,
              GOOGLE_CLIENT_ID: $client_id,
              GOOGLE_REDIRECT_URI: $redirect_uri
            }')"
          export LIGHTSAIL_ENVIRONMENT_JSON="${environment_json}"
          bash infra/aws/deploy-lightsail.sh
