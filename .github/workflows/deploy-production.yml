name: Deploy production

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.PRODUCTION_DEPLOYMENT_ENABLED == 'true' &&
      github.repository == 'soma-team-01/hanbuddy-frontend' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'hanbuddy-frontend' }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      HANBUDDY_API_BASE_URL: ${{ vars.HANBUDDY_API_BASE_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Check required configuration
        run: |
          test -n "${AWS_ROLE_ARN}" || { echo "Missing AWS_ROLE_ARN repository variable"; exit 1; }
          test -n "${EC2_INSTANCE_ID}" || { echo "Missing EC2_INSTANCE_ID production variable"; exit 1; }
          test -n "${HANBUDDY_API_BASE_URL}" || { echo "Missing HANBUDDY_API_BASE_URL production variable"; exit 1; }
          test -n "${GOOGLE_CLIENT_ID}" || { echo "Missing GOOGLE_CLIENT_ID production variable"; exit 1; }
          test -n "${GOOGLE_REDIRECT_URI}" || { echo "Missing GOOGLE_REDIRECT_URI production variable"; exit 1; }
          test -n "${FRONTEND_DOMAIN}" || { echo "Missing FRONTEND_DOMAIN production variable"; exit 1; }
          test -n "${ROUTE53_HOSTED_ZONE_ID}" || { echo "Missing ROUTE53_HOSTED_ZONE_ID production variable"; exit 1; }
          test -n "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" || { echo "Missing NEXT_PUBLIC_GOOGLE_MAPS_API_KEY production secret"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image_tag="production-sha-${COMMIT_SHA}"
          image_uri="${REGISTRY}/${ECR_REPOSITORY}:${image_tag}"
          docker build \
            --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" \
            --tag "${image_uri}" \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:production-latest" \
            .
          docker push "${image_uri}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:production-latest"
          echo "IMAGE_URI=${image_uri}" >> "${GITHUB_ENV}"

      - name: Deploy to EC2
        run: |
          runtime_environment_json="$(jq -n \
            --arg api "${HANBUDDY_API_BASE_URL}" \
            --arg client_id "${GOOGLE_CLIENT_ID}" \
            --arg redirect_uri "${GOOGLE_REDIRECT_URI}" \
            '{
              HANBUDDY_API_BASE_URL: $api,
              GOOGLE_CLIENT_ID: $client_id,
              GOOGLE_REDIRECT_URI: $redirect_uri
            }')"
          export EC2_RUNTIME_ENVIRONMENT_JSON="${runtime_environment_json}"
          bash infra/aws/deploy-ec2.sh
