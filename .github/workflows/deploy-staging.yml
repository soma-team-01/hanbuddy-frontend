name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'hanbuddy-frontend' }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      HANBUDDY_API_BASE_URL: ${{ vars.HANBUDDY_API_BASE_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      PAYPAL_CLIENT_ID: ${{ vars.PAYPAL_CLIENT_ID }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Require the develop branch
        run: |
          if [[ "${GITHUB_REF_NAME}" != "develop" ]]; then
            echo "Run this workflow with 'Use workflow from: develop'."
            exit 1
          fi

      - name: Check required configuration
        run: |
          test -n "${AWS_ROLE_ARN}" || { echo "Missing AWS_ROLE_ARN repository variable"; exit 1; }
          test -n "${EC2_INSTANCE_ID}" || { echo "Missing EC2_INSTANCE_ID staging variable"; exit 1; }
          test -n "${HANBUDDY_API_BASE_URL}" || { echo "Missing HANBUDDY_API_BASE_URL staging variable"; exit 1; }
          test -n "${GOOGLE_CLIENT_ID}" || { echo "Missing GOOGLE_CLIENT_ID staging variable"; exit 1; }
          test -n "${GOOGLE_REDIRECT_URI}" || { echo "Missing GOOGLE_REDIRECT_URI staging variable"; exit 1; }
          test -n "${FRONTEND_DOMAIN}" || { echo "Missing FRONTEND_DOMAIN staging variable"; exit 1; }
          test -n "${ROUTE53_HOSTED_ZONE_ID}" || { echo "Missing ROUTE53_HOSTED_ZONE_ID staging variable"; exit 1; }
          test -n "${PAYPAL_CLIENT_ID}" || { echo "Missing PAYPAL_CLIENT_ID staging variable"; exit 1; }
          test -n "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" || { echo "Missing NEXT_PUBLIC_GOOGLE_MAPS_API_KEY staging secret"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and deploy frontend
        uses: ./.github/actions/deploy-ec2
        with:
          environment-name: staging
          commit-sha: ${{ github.sha }}
          registry: ${{ steps.ecr.outputs.registry }}
