name: Stop staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "stop-staging" to stop the staging EC2 instance
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}

    steps:
      - name: Require the develop branch and confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "develop" ]]; then
            echo "Run this workflow with 'Use workflow from: develop'."
            exit 1
          fi

          if [[ "${CONFIRMATION}" != "stop-staging" ]]; then
            echo 'Confirmation must exactly match "stop-staging".'
            exit 1
          fi

          test -n "${AWS_ROLE_ARN}" || { echo "Missing AWS_ROLE_ARN repository variable"; exit 1; }
          test -n "${EC2_INSTANCE_ID}" || { echo "Missing EC2_INSTANCE_ID staging variable"; exit 1; }
          test -n "${FRONTEND_DOMAIN}" || { echo "Missing FRONTEND_DOMAIN staging variable"; exit 1; }
          test -n "${ROUTE53_HOSTED_ZONE_ID}" || { echo "Missing ROUTE53_HOSTED_ZONE_ID staging variable"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove staging DNS record
        run: |
          record_name="${FRONTEND_DOMAIN%.}."
          record_json="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "${ROUTE53_HOSTED_ZONE_ID}" \
            --query "ResourceRecordSets[?Name == '${record_name}' && Type == 'A'] | [0]" \
            --output json)"

          if [[ "${record_json}" == "null" ]]; then
            echo "No staging A record exists; nothing to delete."
            exit 0
          fi

          change_batch="$(jq -n \
            --argjson record "${record_json}" \
            '{Changes: [{Action: "DELETE", ResourceRecordSet: $record}]}')"

          aws route53 change-resource-record-sets \
            --hosted-zone-id "${ROUTE53_HOSTED_ZONE_ID}" \
            --change-batch "${change_batch}" >/dev/null

      - name: Stop staging EC2 instance
        run: |
          state="$(aws ec2 describe-instances \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"

          if [[ "${state}" == "stopped" ]]; then
            echo "Staging EC2 instance is already stopped."
            exit 0
          fi

          aws ec2 stop-instances --instance-ids "${EC2_INSTANCE_ID}" >/dev/null
          aws ec2 wait instance-stopped --instance-ids "${EC2_INSTANCE_ID}"
          echo "Staging EC2 instance stopped; only its EBS storage continues to incur cost."
